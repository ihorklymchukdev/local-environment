# The Phase 5 payoff: this file is identical locally and in the cloud, and
# differs only by the environment injected around it. Nothing here may
# hardcode a value that has to change between the two -- see the OMELET_*
# variables below, each with the current local default.
#
# Traefik's static config lives entirely on `command:` rather than in a
# mounted traefik.yml: a config file and CLI arguments are mutually
# exclusive sources for the same setting, and only the CLI form lets compose
# interpolate the entry port here. `exposedByDefault: false` and
# `network: edge` below are load-bearing -- drop the first and every
# container in the VM gets a route, drop the second and Traefik picks the
# wrong network on a multi-network container.
#
# The edge network name is the literal `edge`, not a variable: it is
# `constants.EDGE_NETWORK`, an authoritative constant the global rulings
# forbid giving a second name. `agent/core/overlay.py` hardcodes the same
# constant when it labels project containers, so parameterising only the
# Traefik side here would let the two drift -- Traefik watching a network
# nothing is attached to, every route answering 404 with no error anywhere.
services:
  traefik:
    image: traefik:v3.7
    # v3.6+ only: earlier releases ask the daemon for Docker API 1.24, which
    # docker-ce 29 refuses, leaving the Docker provider empty and every route
    # answering 404.
    restart: always
    command:
      - "--entryPoints.web.address=:${OMELET_EDGE_PORT:-39080}"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=edge"
    ports:
      - "${OMELET_EDGE_PORT:-39080}:${OMELET_EDGE_PORT:-39080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge

  agent:
    image: ${OMELET_AGENT_IMAGE:-ghcr.io/ihorklymchukdev/omelet-agent:0.1.0}
    restart: always
    # 0.0.0.0, not 127.0.0.1: WSL2's localhostForwarding only surfaces guest
    # sockets bound to all interfaces. That also means every other container
    # in the VM can reach an agent that holds the Docker socket -- Task 8
    # closes that gap with a shared token, not this file.
    ports:
      - "39099:39099"
    environment:
      - OMELET_DOMAIN=${OMELET_DOMAIN:-127-0-0-1.sslip.io}
      - OMELET_EDGE_PORT=${OMELET_EDGE_PORT:-39080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on both sides, not negotiable: the agent parses compose
      # files, but the bind-mount paths inside them are resolved by dockerd
      # on the VM, not inside this container. A different path here mounts
      # every user project's relative volume onto an empty directory.
      - /opt/omelet:/opt/omelet
    # Fixable without a rebuild when a VM's docker group GID doesn't match
    # the image's build-time default.
    group_add:
      - "${OMELET_DOCKER_GID:-999}"
    networks:
      - edge

networks:
  edge:
    external: true
