[project]
name = "omelet"
version = "0.1.0"
requires-python = ">=3.12"
# The host parses no YAML: compose files are read by the agent, and
# host/providers/omelet.yaml is handed to limactl as a path.
dependencies = ["typer>=0.12"]

[project.scripts]
omelet = "host.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["host*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The configuration option \"asyncio_default_fixture_loop_scope\" is unset:DeprecationWarning",
]
# pytest-asyncio (a globally-installed plugin, unused by this project) emits its
# loop-scope warning from pytest_configure, a phase filterwarnings above can't
# reach; setting the option it asks for removes the warning at the source.
asyncio_default_fixture_loop_scope = "function"
