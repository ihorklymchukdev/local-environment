[project]
name = "runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "pyyaml>=6"]

[project.scripts]
runtime = "runtime.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The configuration option \"asyncio_default_fixture_loop_scope\" is unset:DeprecationWarning",
]
# pytest-asyncio (a globally-installed plugin, unused by this project) emits its
# loop-scope warning from pytest_configure, a phase filterwarnings above can't
# reach; setting the option it asks for removes the warning at the source.
asyncio_default_fixture_loop_scope = "function"
