# UNVERIFIED — macOS/Lima config for parity (see lima.py).
vmType: vz
rosetta:
  enabled: true
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
cpus: 4
memory: "4GiB"
disk: "60GiB"
mounts: []
portForwards:
  - guestPort: 39080
    hostPort: 39080
  # The agent's API. The host CLI dials 127.0.0.1:39099 on both platforms;
  # WSL2 forwards it automatically, Lima only through this list.
  - guestPort: 39099
    hostPort: 39099
