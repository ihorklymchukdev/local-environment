# CONFIRMED ONCE, then still mostly UNVERIFIED (see lima.py). On 2026-09-15,
# on macOS 26.6.2 (build 25G83) arm64 with Lima 2.2.0, the pre-33571da
# revision of exactly this file -- vmType, rosetta.enabled, the aarch64
# image, cpus/memory/disk, and the two portForwards below -- was what
# `limactl start` actually ran; that VM booted, the engine installed, and
# both ports answered. See docs/lima-verification-report.md.
# Everything added after that commit has never been passed to `limactl`: the
# x86_64 image and the `ssh:` block right below it, in particular --
# `ssh.localPort` is a request nobody has confirmed Lima honours.
vmType: vz
rosetta:
  enabled: true
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  # distribution.xml stamps the building machine's arch into hostArchitectures,
  # so an Intel build is a supported artifact and needs an image it can boot.
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 4
memory: "4GiB"
ssh:
    localPort: 39022
disk: "60GiB"
mounts: []
# Only the two fixed ports live here. A user's distinct-port forward (a
# database in the VM on a host port that is free) is made at runtime through
# the ssh control master -- see LimaProvider.forward -- so it needs no edit
# here and no VM restart.
portForwards:
  - guestPort: 39080
    hostPort: 39080
  # The agent's API. The host CLI dials 127.0.0.1:39099 on both platforms;
  # WSL2 forwards it automatically, Lima only through this list.
  - guestPort: 39099
    hostPort: 39099
